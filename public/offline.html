<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2e7d32" />
    <title>AgroTrack — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; color: #1f2937; background: #f7f9f5; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px; text-align: center; background: #fff; border: 1px solid #e3ebe1; border-radius: 10px; }
      img { width: 64px; height: 64px; }
      h1 { margin: 14px 0 6px; color: #2e7d32; font-size: 24px; }
      p { margin: 0; color: #69766c; font-size: 14px; }
      button { min-height: 42px; margin-top: 22px; padding: 0 18px; color: #fff; background: #2e7d32; border: 0; border-radius: 6px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>Anda sedang offline</h1>
      <p>Halaman aplikasi belum tersimpan di perangkat ini. Buka AgroTrack saat online sekali agar aplikasi tersedia saat offline.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
